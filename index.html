<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe4ef">
<meta name="description" content="Révise le programme de CM2 en t'amusant avec Chèvra, la petite chèvre !">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chèvra">
<title>Chèvra – Révisions CM2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐐%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================
   CHÈVRA — styles
   Mobile-first : < 768 px (smartphone), 768-1023 px (tablette), ≥ 1024 px (PC)
   ========================================================= */
:root{
  --bg:#f2fbff; --bg2:#fff8fb; --ink:#33284a; --muted:#5f5474; --card:#ffffff; --line:#e7e0f2;
  --mint:#7fe0c3; --mint-l:#dcf8ef; --pink:#ff9fc4; --pink-l:#ffe4ef; --sun:#ffd36e; --sun-l:#fff4cf;
  --sky:#8fd3ff; --sky-l:#e0f3ff; --lilac:#c3a6ff; --lilac-l:#efe7ff; --peach:#ffb38a; --peach-l:#ffeadf;
  --primary:#c2256b; --primary-d:#a01c58; --ok:#147a52; --ok-l:#d9f6e9; --ko:#b8354c; --ko-l:#ffe3e8;
  --radius:22px; --radius-s:14px; --shadow:0 6px 18px rgba(80,60,120,.12); --shadow-l:0 14px 34px rgba(80,60,120,.16);
  --font: ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Comic Sans MS","Comic Neue","Trebuchet MS",sans-serif;
  --fs:18px; --ls:0; --ws:0; --lh:1.45;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 72px;
}
/* Option « police dyslexie » : police sans empattement très lisible + espacements augmentés */
html.dys{ --font: Verdana,"Trebuchet MS",Tahoma,"DejaVu Sans",sans-serif; --ls:.06em; --ws:.18em; --lh:1.75; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; font-family:var(--font); font-size:var(--fs); line-height:var(--lh); letter-spacing:var(--ls); word-spacing:var(--ws);
  color:var(--ink); background:radial-gradient(1200px 600px at 10% -10%, var(--pink-l), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--sky-l), transparent 60%), linear-gradient(180deg,#f6fcff,#fffaf2);
  background-attachment:fixed; min-height:100vh; -webkit-tap-highlight-color:transparent; overflow-x:hidden}
button,input{font:inherit; letter-spacing:inherit; color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.2; margin:0 0 .4em}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:.3em 0 .8em}
.sr-only{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:4px solid #6b4fd8; outline-offset:3px; border-radius:12px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- Structure générale ---------- */
.app{min-height:100vh}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:8px;
  padding:calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px); border-bottom:2px solid var(--line)}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.25rem; text-decoration:none; color:var(--ink); border:0; background:none; padding:4px}
.brand .logo{width:40px; height:40px}
.pills{display:flex; gap:6px; margin-left:auto; align-items:center}
.pill{display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:999px; background:var(--sun-l); font-weight:700; font-size:.95rem; white-space:nowrap}
.pill.streak{background:var(--peach-l)} .pill.stars{background:var(--lilac-l)}
.iconbtn{min-width:48px; min-height:48px; border-radius:16px; border:2px solid var(--line); background:#fff; font-size:1.3rem; display:inline-flex; align-items:center; justify-content:center}
.iconbtn:active{transform:scale(.95)}

.sidebar{display:contents}
.sidebar .brand, .side-foot{display:none}
.mainnav{position:fixed; z-index:40; left:0; right:0; bottom:0; display:flex; justify-content:space-around;
  padding:6px calc(6px + var(--safe-r)) calc(6px + var(--safe-b)) calc(6px + var(--safe-l)); background:#fff; border-top:2px solid var(--line);
  box-shadow:0 -6px 20px rgba(80,60,120,.08)}
.navbtn{flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:0; background:none;
  border-radius:16px; font-size:.78rem; font-weight:700; color:var(--muted); padding:4px 2px; position:relative}
.navbtn .ni{font-size:1.5rem; line-height:1}
.navbtn[aria-current="page"]{color:var(--primary); background:var(--pink-l)}
.navbtn .badge-dot{position:absolute; top:4px; right:calc(50% - 22px); min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--primary); color:#fff; font-size:.72rem; line-height:20px}
main{padding:16px calc(14px + var(--safe-r)) calc(var(--nav-h) + 24px + var(--safe-b)) calc(14px + var(--safe-l)); outline:none}
.panel{display:none}
body.in-game .mainnav{display:none}
body.in-game main{padding-bottom:calc(24px + var(--safe-b))}

/* ---------- Cartes & boutons ---------- */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; border:2px solid #fff}
.btn{min-height:52px; padding:12px 22px; border-radius:18px; border:0; font-weight:800; font-size:1.05rem; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:#fff; color:var(--ink); box-shadow:0 4px 0 #dcd3ea; transition:transform .12s, box-shadow .12s; text-decoration:none}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #dcd3ea}
.btn.primary{background:var(--primary); color:#fff; box-shadow:0 4px 0 var(--primary-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--primary-d)}
.btn.mint{background:var(--mint-l); box-shadow:0 4px 0 #9fdcc8}
.btn.sun{background:var(--sun); box-shadow:0 4px 0 #e0ae3a}
.btn.wide{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.stack{display:flex; flex-direction:column; gap:12px}
.section-title{display:flex; align-items:center; gap:10px; margin:22px 0 12px}
.section-title h2{margin:0}

/* ---------- Accueil ---------- */
.hello{display:flex; gap:12px; align-items:center}
.hello .chevra-host{width:120px; flex:none}
.hello h1{font-size:1.45rem}
.quick{display:grid; gap:12px; margin-top:14px}
.quick .qbtn{display:flex; align-items:center; gap:14px; text-align:left; border:0; border-radius:var(--radius); padding:14px 16px; min-height:72px; box-shadow:var(--shadow); width:100%}
.qbtn .qi{font-size:2rem}
.qbtn b{display:block; font-size:1.08rem}
.qbtn span.s{font-size:.9rem; color:var(--muted)}
.qbtn.daily{background:linear-gradient(135deg,var(--sun-l),#fff)}
.qbtn.rev{background:linear-gradient(135deg,var(--mint-l),#fff)}
.qbtn.done{opacity:.85}

/* Carte du monde : mobile = chemin vertical d'îles */
.world{position:relative; margin-top:18px; border-radius:28px; padding:16px 10px 24px; overflow:hidden;
  background:linear-gradient(180deg,#bfe9ff,#9fdcff); box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.world::before{content:""; position:absolute; inset:0; opacity:.35; pointer-events:none;
  background-image:radial-gradient(circle at 20px 20px, #fff 2px, transparent 3px); background-size:46px 46px}
.world-svg{display:none}
.islands{position:relative; display:flex; flex-direction:column; gap:6px}
.island{position:relative; border:0; background:none; padding:0; display:flex; align-items:center; gap:12px; width:86%; min-height:110px; text-align:left; color:var(--ink)}
.island:nth-child(even){margin-left:auto; flex-direction:row-reverse; text-align:right}
.island .blob{width:118px; height:96px; flex:none; position:relative; filter:drop-shadow(0 6px 0 rgba(40,90,140,.25)); transition:transform .2s}
.island .blob svg{width:100%; height:100%}
.island .ie{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.4rem; padding-bottom:10px}
.island .il{background:rgba(255,255,255,.92); border-radius:16px; padding:8px 12px; box-shadow:var(--shadow)}
.island .il b{display:block; font-size:1.02rem}
.island .il small{font-size:.85rem; color:var(--muted)}
.island:hover .blob, .island:focus-visible .blob{transform:translateY(-4px) scale(1.04)}
.progressbar{display:block; width:100%; height:10px; border-radius:6px; background:#ece6f5; overflow:hidden; margin-top:4px}
.progressbar > i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--mint),#3cc59a); transition:width .6s}
.boat{display:none}

/* ---------- Île (liste des thèmes) ---------- */
.island-head{display:flex; align-items:center; gap:12px; border-radius:var(--radius); padding:16px; margin-bottom:14px}
.island-head .big{font-size:2.6rem}
.backbtn{min-height:48px; min-width:48px; border-radius:16px; border:2px solid var(--line); background:#fff; font-weight:800; padding:0 14px}
.themes{display:grid; gap:14px}
.theme{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
.theme-top{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.theme-top .te{font-size:1.8rem}
.theme-top h3{margin:0; font-size:1.1rem}
.levels{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.lvl{min-height:84px; border-radius:18px; border:3px solid var(--line); background:var(--bg2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-weight:800; padding:6px}
.lvl .ln{font-size:.85rem; color:var(--muted)}
.lvl .ls{font-size:1.05rem; letter-spacing:1px}
.lvl.open{border-color:var(--mint); background:var(--mint-l)}
.lvl.done{border-color:var(--sun); background:var(--sun-l)}
.lvl.locked{opacity:.6; cursor:not-allowed; background:#f3f0f7}
.lvl:not(.locked):hover{transform:translateY(-2px)}
.chrono-card{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,var(--sky-l),#fff)}

/* ---------- Écran de jeu ---------- */
.game-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.game-head .gt{font-weight:800; font-size:1rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin:2px 0 10px}
.dot{width:14px; height:14px; border-radius:50%; background:#e3dcef}
.dot.cur{background:var(--sun); transform:scale(1.25)}
.dot.ok{background:#3cc59a} .dot.ko{background:#ff8fa7}
.game-chevra{display:flex; align-items:flex-end; gap:8px; margin-bottom:10px}
.game-chevra .chevra-host{width:130px; flex:none}
.bubble{position:relative; background:#fff; border-radius:20px; padding:12px 14px; box-shadow:var(--shadow); font-weight:700; font-size:1rem; flex:1; margin-bottom:22px}
.bubble::after{content:""; position:absolute; left:-10px; bottom:16px; border:10px solid transparent; border-right-color:#fff; border-left:0}
.qcard{background:#fff; border-radius:26px; box-shadow:var(--shadow-l); padding:18px; animation:pop .35s ease}
.qtag{display:inline-flex; gap:6px; align-items:center; font-size:.8rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--lilac-l); border-radius:999px; padding:4px 10px; margin-bottom:8px}
.qtext{font-size:1.25rem; font-weight:800; margin:4px 0 16px}
.choices{display:grid; gap:10px}
.choice{min-height:58px; border-radius:18px; border:3px solid var(--line); background:#fff; text-align:left; padding:10px 16px; font-weight:700; font-size:1.08rem; display:flex; align-items:center; gap:12px; transition:transform .1s, border-color .2s, background .2s}
.choice .k{flex:none; width:30px; height:30px; border-radius:10px; background:var(--sky-l); display:flex; align-items:center; justify-content:center; font-size:.9rem}
.choice:hover:not(:disabled){border-color:var(--sky)}
.choice:active:not(:disabled){transform:scale(.98)}
.choice.good{border-color:#3cc59a; background:var(--ok-l)}
.choice.bad{border-color:#ff8fa7; background:var(--ko-l)}
.choice:disabled{cursor:default}
.vf{grid-template-columns:1fr 1fr}
.vf .choice{justify-content:center; font-size:1.25rem; min-height:76px; text-align:center}
.blank{display:inline-block; min-width:90px; border-bottom:4px dashed var(--lilac); text-align:center; padding:0 6px; color:var(--primary)}
.blank.filled{border-bottom-style:solid}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{min-height:52px; padding:8px 16px; border-radius:16px; border:3px solid var(--line); background:#fff; font-weight:800; font-size:1.05rem; touch-action:none; user-select:none; -webkit-user-select:none}
.chip.sel{border-color:var(--primary); background:var(--pink-l); transform:translateY(-2px)}
.chip.good{border-color:#3cc59a; background:var(--ok-l)} .chip.bad{border-color:#ff8fa7; background:var(--ko-l)}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed; z-index:200; pointer-events:none; box-shadow:var(--shadow-l); transform:rotate(-3deg) scale(1.05); left:0; top:0}
.pool{min-height:64px; padding:10px; border-radius:18px; background:#f7f4fb; margin-bottom:12px}
.zones{display:grid; gap:10px}
.zone{min-height:96px; border-radius:20px; border:3px dashed var(--lilac); background:var(--lilac-l); padding:10px; text-align:left; display:flex; flex-direction:column; gap:8px}
.zone .zt{font-weight:800}
.zone.over{background:var(--sun-l); border-color:var(--sun)}
.zone .chips{gap:8px}
.zone .chip{min-height:46px; font-size:.98rem}
.hint{font-size:.92rem; color:var(--muted); margin:-6px 0 10px}
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:flex; flex-direction:column; gap:10px}
.mitem{min-height:56px; border-radius:16px; border:3px solid var(--line); background:#fff; font-weight:700; padding:8px 10px; position:relative; text-align:center}
.mitem.sel{border-color:var(--primary); background:var(--pink-l)}
.mitem .pairno{position:absolute; top:-10px; right:-8px; width:26px; height:26px; border-radius:50%; color:#fff; font-size:.85rem; line-height:26px; font-weight:800}
.mitem.good{border-color:#3cc59a!important; background:var(--ok-l)!important}
.mitem.bad{border-color:#ff8fa7!important; background:var(--ko-l)!important}
.answerline{min-height:70px; border-radius:18px; border:3px dashed var(--sky); background:var(--sky-l); padding:10px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center}
.answerline.frise{flex-direction:column; align-items:stretch}
.answerline.frise .chip{text-align:left}
.answerline.frise .chip::before{content:attr(data-n) ". "; color:var(--primary)}
.answerline.letters .chip{min-width:52px; font-size:1.3rem}
.answerline .ph{color:var(--muted); font-size:.95rem}
.dictee-box{display:flex; flex-direction:column; gap:12px}
.dictee-box input{min-height:60px; border-radius:18px; border:3px solid var(--lilac); padding:10px 16px; font-size:1.3rem; font-weight:700; width:100%; background:#fff}
.dictee-box input:focus{border-color:var(--primary); outline:none; box-shadow:0 0 0 4px var(--pink-l)}
.flash{font-size:2rem; font-weight:800; text-align:center; padding:16px; border-radius:18px; background:var(--sun-l)}
.calc-display{font-size:2.2rem; font-weight:800; text-align:center; margin:8px 0}
.calc-answer{min-height:64px; border-radius:18px; border:3px solid var(--sky); background:var(--sky-l); font-size:2rem; font-weight:800; text-align:center; padding:6px; margin:0 auto 12px; max-width:320px}
.timer{height:12px; border-radius:6px; background:#eee7f5; overflow:hidden; margin-bottom:12px}
.timer > i{display:block; height:100%; background:linear-gradient(90deg,var(--mint),var(--sun),var(--pink)); width:100%}
.numpad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:340px; margin:0 auto}
.numpad button{min-height:58px; border-radius:16px; border:0; background:#fff; box-shadow:0 3px 0 #dcd3ea; font-size:1.5rem; font-weight:800}
.numpad button.ok{background:var(--primary); color:#fff; box-shadow:0 3px 0 var(--primary-d)}
.numpad button:active{transform:translateY(2px)}
.checkrow{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap}
.feedback{margin-top:14px; border-radius:22px; padding:16px; animation:slideup .3s ease}
.feedback.good{background:var(--ok-l); border:3px solid #9fe3c8}
.feedback.bad{background:var(--peach-l); border:3px solid #ffc9a8}
.feedback .ft{font-weight:800; font-size:1.2rem; margin-bottom:4px}
.feedback .expl{margin:6px 0 12px}
.feedback .ans{font-weight:800}
@media (max-width:767.98px){
  .feedback{position:fixed; left:0; right:0; bottom:0; z-index:60; margin:0; border-radius:24px 24px 0 0; max-height:70vh; overflow:auto;
    padding:18px calc(18px + var(--safe-r)) calc(18px + var(--safe-b)) calc(18px + var(--safe-l)); box-shadow:0 -10px 30px rgba(80,60,120,.2)}
  body.has-feedback main{padding-bottom:300px}
}

/* ---------- Victoire ---------- */
.victory{text-align:center}
.victory .chevra-host{width:190px; margin:0 auto}
.bigstars{display:flex; justify-content:center; gap:10px; font-size:3.2rem; margin:8px 0}
.bigstars span{filter:grayscale(1) opacity(.3)}
.bigstars span.on{filter:none; animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span.on:nth-child(2){animation-delay:.25s} .bigstars span.on:nth-child(3){animation-delay:.5s}
.rewards{display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:10px 0 18px}
.reward{background:#fff; border-radius:18px; padding:10px 16px; box-shadow:var(--shadow); font-weight:800}
.newbadge{background:linear-gradient(135deg,var(--sun-l),var(--pink-l)); border-radius:18px; padding:12px; margin:10px auto; max-width:420px; font-weight:800}

/* ---------- Boutique / badges / réglages ---------- */
.grid{display:grid; gap:14px; grid-template-columns:repeat(2,1fr)}
.item{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center}
.item .prev{width:100%; max-width:120px}
.item b{font-size:1rem}
.item .price{font-weight:800}
.item.equipped{outline:4px solid var(--mint)}
.badge{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; text-align:center}
.badge .bi{font-size:2.2rem}
.badge.locked .bi{filter:grayscale(1) opacity(.35)}
.badge b{display:block; font-size:.95rem}
.badge small{color:var(--muted); font-size:.82rem}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:8px 0; border-bottom:2px solid #f2eef8}
.toggle:last-child{border-bottom:0}
.switch{width:64px; height:36px; border-radius:18px; background:#ddd5ea; border:0; position:relative; flex:none; transition:background .2s}
.switch::after{content:""; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .2s}
.switch[aria-checked="true"]{background:#2fae84}
.switch[aria-checked="true"]::after{left:32px}
.textin{min-height:52px; border-radius:16px; border:3px solid var(--line); padding:8px 14px; font-size:1.1rem; width:100%}
.statgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.stat{background:var(--bg2); border-radius:18px; padding:12px; text-align:center}
.stat b{display:block; font-size:1.5rem}
.stat small{color:var(--muted)}
table.ptable{width:100%; border-collapse:collapse; font-size:.95rem}
.ptable th,.ptable td{padding:10px 6px; border-bottom:2px solid #f2eef8; text-align:left}
.ptable th{font-size:.85rem; color:var(--muted)}
.weak li{margin-bottom:6px}
.gate{max-width:420px; margin:20px auto; text-align:center}
.gate .calc-display{font-size:1.8rem}

/* ---------- Panneau Chèvra (PC) ---------- */
.panel .chevra-host{width:200px; margin:0 auto}
.panel .bubble{margin:0 0 10px} .panel .bubble::after{left:50%; bottom:-10px; top:auto; border:10px solid transparent; border-top-color:#fff; border-bottom:0; transform:translateX(-50%)}
.mini-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.mini-stats div{background:var(--bg2); border-radius:16px; padding:8px 4px; text-align:center; font-weight:800}
.mini-stats small{display:block; font-weight:600; color:var(--muted); font-size:.75rem}
.lvlbar{margin:8px 0 14px}
.subj-prog{display:flex; flex-direction:column; gap:8px}
.subj-prog .sp{display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; font-size:.88rem; font-weight:700}

/* ---------- Mascotte ---------- */
.chevra-host{position:relative}
.chevra{width:100%; height:auto; display:block; overflow:visible}
.chevra .acc, .chevra .eyes-happy, .chevra .eyes-wink, .chevra .eyes-look, .chevra .m-big, .chevra .m-o, .chevra .m-soft,
.chevra .c-think, .chevra .c-sparkles, .chevra .c-brows{display:none}
.chevra.mood-happy .m-smile{display:none} .chevra.mood-happy .m-big{display:inline}
.chevra.mood-celebrate .eyes-open, .chevra.mood-celebrate .m-smile{display:none}
.chevra.mood-celebrate .eyes-happy, .chevra.mood-celebrate .m-big, .chevra.mood-celebrate .c-sparkles{display:inline}
.chevra.mood-encourage .eyes-open{display:none} .chevra.mood-encourage .eyes-wink{display:inline}
.chevra.mood-think .eyes-open, .chevra.mood-think .m-smile{display:none}
.chevra.mood-think .eyes-look, .chevra.mood-think .m-o, .chevra.mood-think .c-think, .chevra.mood-think .c-brows{display:inline}
.chevra.mood-sad .m-smile{display:none} .chevra.mood-sad .m-soft, .chevra.mood-sad .c-brows{display:inline}
.chevra.mood-sad .b-l{transform:rotate(-12deg); transform-origin:82px 70px} .chevra.mood-sad .b-r{transform:rotate(12deg); transform-origin:118px 70px}
.chevra.has-glasses .acc-glasses, .chevra.has-sunglasses .acc-sunglasses, .chevra.has-flower .acc-flower, .chevra.has-bow .acc-bow,
.chevra.has-hat .acc-hat, .chevra.has-wizard .acc-wizard, .chevra.has-crown .acc-crown, .chevra.has-scarf .acc-scarf,
.chevra.has-bowtie .acc-bowtie, .chevra.has-headphones .acc-headphones{display:inline}
.chevra .c-all{transform-origin:100px 200px; animation:idle 3.2s ease-in-out infinite}
.chevra .c-head{transform-origin:100px 125px}
.chevra .eye{transform-box:fill-box; transform-origin:center; animation:blink 5s infinite}
.chevra .c-tail{transform-origin:156px 140px; animation:wag 1.2s ease-in-out infinite}
.chevra.mood-happy .c-all{animation:hop .55s ease 2}
.chevra.mood-celebrate .c-all{animation:jump .8s ease-in-out infinite}
.chevra.mood-celebrate .c-sparkles path{transform-box:fill-box; transform-origin:center; animation:twinkle 1s ease-in-out infinite}
.chevra.mood-celebrate .c-sparkles path:nth-child(2){animation-delay:.3s} .chevra.mood-celebrate .c-sparkles path:nth-child(3){animation-delay:.6s}
.chevra.mood-think .c-head{animation:tilt 2.6s ease-in-out infinite}
.chevra.mood-think .c-think{animation:floaty 2s ease-in-out infinite}
.chevra.mood-sad .c-head{transform:rotate(-5deg) translateY(3px); transition:transform .4s}
.chevra.mood-encourage .c-head{animation:nod .7s ease 2}

@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(2px)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(-22px) rotate(4deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg) translateY(2px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes twinkle{0%,100%{transform:scale(.6); opacity:.5}50%{transform:scale(1.15); opacity:1}}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:scale(1); opacity:1}}
@keyframes slideup{from{transform:translateY(20px); opacity:0}to{transform:none; opacity:1}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes sparkle{0%,100%{opacity:.2; transform:scale(.7)}50%{opacity:1; transform:scale(1.1)}}
.shake{animation:shake .35s ease 2}
.screen{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.sparkles{position:relative}
.sparkles::after{content:"✨"; position:absolute; right:-6px; top:-10px; animation:sparkle 1.6s ease-in-out infinite}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:300; width:100%; height:100%}
.toast{position:fixed; left:50%; top:calc(14px + var(--safe-t)); transform:translateX(-50%); z-index:310; background:#fff; border-radius:18px; padding:12px 18px; box-shadow:var(--shadow-l); font-weight:800; animation:slideup .3s ease; max-width:92vw; text-align:center}
.modal-back{position:fixed; inset:0; background:rgba(51,40,74,.4); z-index:320; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{background:#fff; border-radius:26px; padding:22px; max-width:420px; width:100%; box-shadow:var(--shadow-l); text-align:center}

/* Option « réduire les animations » (et préférence système) */
html.calm *, html.calm *::before, html.calm *::after{animation:none!important; transition:none!important}

/* =================== TABLETTE 768–1023 =================== */
@media (min-width:768px){
  :root{--fs:18px}
  .topbar{padding:12px 24px}
  .mainnav{position:sticky; top:73px; bottom:auto; justify-content:center; gap:8px; border-top:0; border-bottom:2px solid var(--line); box-shadow:none; background:rgba(255,255,255,.92); z-index:29; padding:8px 16px}
  .navbtn{flex:none; flex-direction:row; gap:8px; font-size:1rem; padding:8px 16px; min-height:52px}
  .navbtn .ni{font-size:1.3rem}
  .navbtn .badge-dot{position:static; margin-left:2px}
  main{padding:24px 28px 40px; max-width:980px; margin:0 auto}
  body.in-game .mainnav{display:flex}
  .quick{grid-template-columns:1fr 1fr}
  .hello .chevra-host{width:150px}
  .world{padding:24px}
  .islands{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .island, .island:nth-child(even){width:auto; margin:0; flex-direction:column; text-align:center}
  .island .blob{width:150px; height:118px}
  .themes{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(3,1fr)}
  .statgrid{grid-template-columns:repeat(4,1fr)}
  .choices{grid-template-columns:1fr 1fr}
  .zones{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .game-chevra .chevra-host{width:150px}
  .qcard{padding:26px}
}
/* =================== PC ≥ 1024 =================== */
@media (min-width:1024px){
  :root{--fs:17px}
  body{background-attachment:fixed}
  .app{display:grid; grid-template-columns:224px minmax(0,1fr) 300px; max-width:1720px; margin:0 auto; min-height:100vh}
  .victory .chevra-host{display:none}
  .topbar{display:none}
  .sidebar{display:flex; flex-direction:column; gap:10px; position:sticky; top:0; height:100vh; padding:26px 18px; background:rgba(255,255,255,.75); border-right:2px solid var(--line); backdrop-filter:blur(6px)}
  .sidebar .brand{display:flex; font-size:1.45rem; margin-bottom:18px}
  .sidebar .brand .logo{width:52px; height:52px}
  .mainnav{position:static; flex-direction:column; justify-content:flex-start; gap:6px; background:none; border:0; padding:0; box-shadow:none}
  .navbtn{width:100%; justify-content:flex-start; font-size:1.02rem; padding:12px 16px; color:var(--ink)}
  .navbtn:hover{background:var(--sky-l)}
  .side-foot{display:flex; flex-direction:column; gap:8px; margin-top:auto}
  .side-foot .btn{justify-content:flex-start; min-height:48px; font-size:.95rem; box-shadow:none; border:2px solid var(--line)}
  main{max-width:none; width:100%; padding:40px 48px 60px; margin:0}
  main > .screen{max-width:1040px; margin:0 auto}
  .panel{display:block; position:sticky; top:0; height:100vh; overflow:auto; padding:30px 24px; background:rgba(255,255,255,.6); border-left:2px solid var(--line)}
  .hello .chevra-host, .game-chevra{display:none}
  .hello h1{font-size:2rem}
  .quick{grid-template-columns:1fr 1fr; gap:18px}
  .world{padding:34px 28px 40px; margin-top:26px}
  .world-svg{display:block; position:absolute; inset:0; width:100%; height:100%}
  .islands{display:grid; grid-template-columns:repeat(3,1fr); gap:26px 18px; align-items:start}
  .island, .island:nth-child(even){width:auto; flex-direction:column; text-align:center; margin:0}
  .island:nth-child(3n+2){margin-top:44px}
  .island .blob{width:min(100%,170px); height:auto; aspect-ratio:170/134}
  .island .ie{font-size:3rem}
  .island .il{width:100%; max-width:220px}
  .boat{display:block; position:absolute; font-size:2rem; left:8%; top:47%; animation:sail 16s ease-in-out infinite}
  @keyframes sail{0%,100%{transform:translateX(0) rotate(-3deg)}50%{transform:translateX(min(60vw,520px)) rotate(3deg)}}
  .themes{grid-template-columns:repeat(2,1fr); gap:20px}
  .grid{grid-template-columns:repeat(4,1fr); gap:18px}
  .qcard{padding:34px 38px; max-width:860px; margin:0 auto}
  .game-head, .dots{max-width:860px; margin-left:auto; margin-right:auto}
  .feedback{max-width:860px; margin:16px auto 0}
  .qtext{font-size:1.45rem}
  .choice:hover:not(:disabled){transform:translateY(-2px)}
  .btn:hover:not(:disabled){filter:brightness(1.04)}
  .island-head{padding:24px 28px}
}
@media (min-width:1440px){ .app{grid-template-columns:256px minmax(0,1fr) 340px} }
@media (min-width:1600px){
  .app{grid-template-columns:280px minmax(0,1fr) 380px}
  .world{padding:44px 40px 50px}
  :root{--fs:18px}
  .panel .chevra-host{width:250px}
}
@media (min-width:1024px) and (max-height:760px){ .panel .chevra-host{width:170px} }
/* Très petits écrans : on garde le logo, on retire le nom pour laisser la place aux compteurs */
@media (max-width:419.98px){
  .topbar .brand span{display:none}
  .pill{padding:6px 8px; font-size:.9rem}
  .pills{gap:4px}
  .navbtn{font-size:.72rem}
}
@media (max-width:339.98px){ .pill.stars{display:none} }

<body>
<!--
  CHÈVRA – application de révision CM2 pour Alicia.
  Un seul fichier, fonctionne hors ligne. Progression enregistrée uniquement dans ce navigateur (localStorage).
  Pour ajouter des questions : voir le bloc « DONNÉES » dans le premier bloc script ci-dessous.
-->
<div class="app" id="app">
  <header class="topbar">
    <button class="brand" aria-label="Chèvra, retour à la carte"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#ffe4ef"/><text x="50" y="68" font-size="54" text-anchor="middle">🐐</text></svg><span>Chèvra</span></button>
    <div class="pills" id="pills"></div>
    <button class="iconbtn soundbtn" aria-pressed="false" aria-label="Couper le son">🔊</button>
  </header>
  <aside class="sidebar" aria-label="Menu">
    <button class="brand" aria-label="Chèvra, retour à la carte"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#ffe4ef"/><text x="50" y="68" font-size="54" text-anchor="middle">🐐</text></svg><span>Chèvra<br><small class="muted" style="font-size:.8rem;font-weight:600">Révisions CM2</small></span></button>
    <nav class="mainnav" id="nav" aria-label="Navigation principale"></nav>
    <div class="side-foot">
      <button class="btn soundbtn" aria-pressed="false">🔊 Son activé</button>
      <button class="btn" data-go="parents">👨‍👩‍👧 Espace parents</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <aside class="panel" id="panel" aria-label="Chèvra et ta progression"></aside>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p style="padding:20px">Chèvra a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur.</p></noscript>
<script>
/* =====================================================================
   DONNÉES — toutes les questions de Chèvra
   ---------------------------------------------------------------------
   Pour ajouter une question, copie une ligne existante dans le bon thème
   et modifie-la. N'oublie pas la virgule à la fin de la ligne.
   Champs communs :
     type        : "qcm" | "vraifaux" | "trou" | "classer" | "relier" | "ordre" | "dictee" | "calcul"
     niveau      : 1 = facile, 2 = moyen, 3 = difficile (= niveau du jeu où elle apparaît)
     question    : l'énoncé affiché
     explication : courte explication montrée après la réponse
   Selon le type :
     qcm      : choix: ["…","…"], reponse: numéro de la bonne réponse dans choix (0 = la première).
                Les choix sont mélangés automatiquement à l'affichage.
     vraifaux : reponse: true ou false
     trou     : question contenant ___ (3 tirets bas) à l'endroit du trou, choix: [...], reponse: numéro
     classer  : categories: ["A","B"(,"C")], elements: [["étiquette", numéro de catégorie], …]
     relier   : paires: [["gauche","droite"], …] (4 paires conseillées)
     ordre    : elements: [...] DANS LE BON ORDRE (ils seront mélangés), style: "frise" | "liste" | "mots" | "lettres"
     dictee   : reponse: "mot" (ou ["forme 1","forme 2"] si plusieurs réponses acceptées),
                ecoute: true pour faire lire le mot à voix haute (synthèse vocale de l'appareil), langue: "fr-FR" ou "en-GB"
     calcul   : question: "7 × 8", reponse: 56 (nombre), temps: secondes (facultatif)
   ===================================================================== */
const DATA = {
  matieres: [
  /* ================= FRANÇAIS ================= */
  { id: "francais", nom: "Français", ile: "L'île aux Mots", emoji: "📚", couleur: "#ff9fc4",
    themes: [
    { id: "grammaire", nom: "Grammaire", emoji: "🧩",
      questions: [
        { type: "qcm", niveau: 1, question: "Dans « Le chat dort sur le canapé », quelle est la nature du mot « chat » ?", choix: ["un nom commun", "un verbe", "un adjectif", "un déterminant"], reponse: 0, explication: "« chat » désigne un animal : c'est un nom commun, précédé du déterminant « le »." },
        { type: "qcm", niveau: 1, question: "Quel est le sujet du verbe dans « Les enfants jouent dans la cour » ?", choix: ["Les enfants", "jouent", "la cour", "dans"], reponse: 0, explication: "Qui est-ce qui joue ? Les enfants. C'est le sujet du verbe « jouent »." },
        { type: "vraifaux", niveau: 1, question: "« Rapidement » est un adverbe.", reponse: true, explication: "Les mots en -ment comme « rapidement » sont souvent des adverbes : ils sont invariables et précisent le verbe." },
        { type: "classer", niveau: 1, question: "Classe ces mots selon leur nature.", categories: ["Nom", "Verbe", "Adjectif"], elements: [["maison", 0], ["chanter", 1], ["joli", 2], ["arbre", 0], ["courir", 1], ["grand", 2]], explication: "Un nom désigne une chose ou un être, un verbe une action, un adjectif décrit le nom." },
        { type: "qcm", niveau: 1, question: "Dans « Ma petite sœur mange une pomme », quel mot est un adjectif ?", choix: ["petite", "sœur", "mange", "pomme"], reponse: 0, explication: "« petite » décrit le nom « sœur » : c'est un adjectif qualificatif." },
        { type: "qcm", niveau: 2, question: "Dans « Léa lit un roman », quelle est la fonction de « un roman » ?", choix: ["COD", "COI", "sujet", "complément circonstanciel"], reponse: 0, explication: "Léa lit quoi ? un roman. Il est relié au verbe sans préposition : c'est un COD." },
        { type: "qcm", niveau: 2, question: "Dans « Paul parle à son voisin », « à son voisin » est :", choix: ["un COI", "un COD", "le sujet", "un CC de lieu"], reponse: 0, explication: "Paul parle à qui ? à son voisin. Le complément est introduit par la préposition « à » : c'est un COI." },
        { type: "classer", niveau: 2, question: "Classe ces compléments circonstanciels.", categories: ["Lieu", "Temps", "Manière"], elements: [["dans le jardin", 0], ["hier soir", 1], ["avec douceur", 2], ["sous la table", 0], ["à midi", 1], ["en silence", 2]], explication: "Lieu : où ? Temps : quand ? Manière : comment ?" },
        { type: "trou", niveau: 2, question: "Dans « Demain, nous irons à la mer », « Demain » est un complément circonstanciel de ___.", choix: ["temps", "lieu", "manière"], reponse: 0, explication: "« Demain » répond à la question « quand ? » : c'est un CC de temps." },
        { type: "vraifaux", niveau: 2, question: "Dans « Le facteur apporte une lettre à Mamie », « une lettre » est un COI.", reponse: false, explication: "Le facteur apporte quoi ? une lettre : c'est le COD. « à Mamie » est le COI." },
        { type: "ordre", niveau: 2, question: "Remets les mots dans l'ordre pour former une phrase correcte.", elements: ["Le", "chien", "ronge", "un", "os."], style: "mots", explication: "Une phrase commence par une majuscule et se termine par un point : sujet + verbe + complément." },
        { type: "qcm", niveau: 3, question: "Quel est le sujet dans « Dans la forêt vivent des loups » ?", choix: ["des loups", "la forêt", "vivent", "Dans la forêt"], reponse: 0, explication: "Qui est-ce qui vit dans la forêt ? des loups. Ici le sujet est placé après le verbe : il est inversé." },
        { type: "qcm", niveau: 3, question: "Dans « Je le regarde », quelle est la fonction du pronom « le » ?", choix: ["COD", "COI", "sujet", "complément circonstanciel"], reponse: 0, explication: "Je regarde qui ? le. Le pronom « le » remplace un COD et se place avant le verbe." },
        { type: "relier", niveau: 3, question: "Dans « Le matin, Tom donne du pain aux canards », relie chaque groupe à sa fonction.", paires: [["Le matin", "CC de temps"], ["Tom", "sujet"], ["du pain", "COD"], ["aux canards", "COI"]], explication: "Tom donne quoi ? du pain (COD). À qui ? aux canards (COI). Quand ? le matin (CC de temps)." },
        { type: "qcm", niveau: 3, question: "Dans « Elle leur a offert des fleurs », le mot « leur » est :", choix: ["un pronom COI", "un COD", "un déterminant possessif", "le sujet"], reponse: 0, explication: "Elle a offert des fleurs à qui ? à eux → « leur ». Placé devant le verbe, c'est un pronom COI." },
        { type: "vraifaux", niveau: 3, question: "Un complément circonstanciel peut souvent être déplacé ou supprimé dans la phrase.", reponse: true, explication: "Exemple : « Le soir, je lis. » → « Je lis le soir. » → « Je lis. » La phrase reste correcte." },
        { type: "classer", niveau: 3, question: "Classe ces petits mots selon leur nature.", categories: ["Déterminant", "Pronom", "Préposition"], elements: [["ces", 0], ["nous", 1], ["avec", 2], ["mon", 0], ["elles", 1], ["sous", 2]], explication: "Le déterminant accompagne un nom, le pronom remplace un nom, la préposition introduit un complément." },
      ] },
    { id: "conjugaison", nom: "Conjugaison", emoji: "⏰",
      questions: [
        { type: "trou", niveau: 1, question: "Au présent : Nous ___ nos devoirs.", choix: ["finissons", "finissez", "finissent"], reponse: 0, explication: "« finir » est du 2e groupe : nous finissons." },
        { type: "qcm", niveau: 1, question: "Quel est l'infinitif de « nous prenions » ?", choix: ["prendre", "prenir", "prenions", "apprendre"], reponse: 0, explication: "« prenions » est le verbe « prendre » à l'imparfait." },
        { type: "trou", niveau: 1, question: "À l'imparfait : Autrefois, les enfants ___ à la marelle.", choix: ["jouaient", "jouent", "joueront"], reponse: 0, explication: "À l'imparfait, avec « ils/elles », la terminaison est -aient." },
        { type: "trou", niveau: 1, question: "Au futur : Demain, tu ___ ton cadeau.", choix: ["auras", "aurais", "as"], reponse: 0, explication: "Le verbe « avoir » au futur : j'aurai, tu auras, il aura…" },
        { type: "classer", niveau: 1, question: "Classe ces verbes selon leur groupe.", categories: ["1er groupe", "2e groupe", "3e groupe"], elements: [["chanter", 0], ["grandir", 1], ["prendre", 2], ["danser", 0], ["finir", 1], ["voir", 2]], explication: "1er groupe : -er. 2e groupe : -ir avec « nous …issons ». Les autres sont du 3e groupe." },
        { type: "trou", niveau: 2, question: "Au passé composé : Hier, elles ___ au cinéma.", choix: ["sont allées", "ont allé", "sont allé"], reponse: 0, explication: "« aller » se conjugue avec « être » : le participe s'accorde avec le sujet « elles » (féminin pluriel)." },
        { type: "qcm", niveau: 2, question: "« Il était une fois un roi qui avait trois filles. » À quel temps sont les verbes ?", choix: ["l'imparfait", "le passé simple", "le présent", "le futur"], reponse: 0, explication: "« était » et « avait » se terminent par -ait : c'est l'imparfait." },
        { type: "trou", niveau: 2, question: "Au passé simple : Le chevalier ___ son épée.", choix: ["prit", "prenait", "prendra"], reponse: 0, explication: "« prendre » au passé simple : il prit." },
        { type: "vraifaux", niveau: 2, question: "« Range ta chambre ! » est à l'impératif.", reponse: true, explication: "L'impératif sert à donner un ordre ou un conseil, sans sujet exprimé." },
        { type: "trou", niveau: 2, question: "Au conditionnel présent : Si j'avais des ailes, je ___.", choix: ["volerais", "volerai", "volais"], reponse: 0, explication: "Le conditionnel présent se termine par -rais avec « je » : je volerais." },
        { type: "ordre", niveau: 2, question: "Remets les mots dans l'ordre pour former une phrase au plus-que-parfait.", elements: ["Nous", "avions", "fini", "nos", "devoirs."], style: "mots", explication: "Le plus-que-parfait : auxiliaire à l'imparfait (avions) + participe passé (fini)." },

/* ---------- 4. Sons doux (Web Audio API, aucun fichier) ---------- */
let actx = null;
function ac(){ if(!actx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; actx = new C(); } if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, start, dur, type='sine', vol=.12){
  const a=ac(); if(!a) return; const t=a.currentTime+start; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX = {
  tap(){ tone(660,0,.07,'triangle',.05); },
  good(){ tone(784,0,.14,'triangle'); tone(1046,.11,.22,'triangle'); },
  bad(){ tone(330,0,.18,'sine',.09); tone(294,.14,.25,'sine',.07); },
  coin(){ tone(988,0,.08,'square',.04); tone(1319,.07,.16,'square',.04); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.11)); }
};

/* ---------- 7. Série quotidienne ---------- */
function touchStreak(){
  const t=todayStr(); const st=S.streak;
  if(st.last===t) return;
  if(st.last && daysBetween(st.last,t)===1) st.count++; else st.count=1;
  st.last=t; st.best=Math.max(st.best||0, st.count);
}
function currentStreak(){ const st=S.streak; if(!st.last) return 0; const d=daysBetween(st.last,todayStr()); return d<=1? st.count : 0; }

/* ---------- 8. Révision intelligente (répétition espacée simple) ---------- */
// Une question ratée entre dans la boîte 0 : elle est à revoir tout de suite.
// En révision : bonne réponse → revue dans 1, 3, 7 puis 14 jours ; ensuite elle est maîtrisée et sort de la liste.
// Mauvaise réponse en révision → retour en boîte 0, à revoir dès demain.
const SRS_DAYS = [1,3,7,14];
function srsMiss(q, inRevision){ S.srs[q.id] = {box:0, due: inRevision? addDays(todayStr(),1) : todayStr()}; }
function srsHit(q){ const it=S.srs[q.id]; if(!it) return; if(it.box>=SRS_DAYS.length){ delete S.srs[q.id]; return; } it.due=addDays(todayStr(), SRS_DAYS[it.box]); it.box++; }
function srsDue(){ const t=todayStr(); return Object.entries(S.srs).filter(([id,v])=>QBYID[id] && v.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>QBYID[id]); }

/* ---------- 9. Défi du jour (5 questions, les mêmes toute la journée) ---------- */
function dailyQuestions(){
  const r=seeded(parseInt(hash('defi'+todayStr()),36));
  const subj=SUBJECTS.map(s=>({s,k:r()})).sort((a,b)=>a.k-b.k).slice(0,5).map(x=>x.s);
  return subj.map(s=>{ const pool=ALLQ.filter(q=>q.subj===s.id && q.type!=='dictee'); return pool[Math.floor(r()*pool.length)]; });
}

let SESSION = null;          // partie en cours
let lastResult = null;       // résultat affiché sur l'écran de victoire

function render(){
  const [r, a] = routeParts();
  if(r!=='jeu' && SESSION){ if(SESSION.timer) clearInterval(SESSION.timer); SESSION=null; }
  closeModal();
  document.body.classList.toggle('in-game', r==='jeu'||r==='fin');
  document.body.classList.remove('has-feedback');
  renderFrame();
  const main=$('#main');
  let html='';
  switch(r){
    case 'ile': html=screenIsland(a); break;
    case 'jeu': if(!SESSION){ return go('carte'); } html='<section class="screen" id="game"></section>'; break;
    case 'fin': if(!lastResult){ return go('carte'); } html=screenVictory(); break;
    case 'defi': html=screenDaily(); break;
    case 'revision': html=screenRevision(); break;
    case 'boutique': html=screenShop(); break;
    case 'moi': html=screenMe(); break;
    case 'parents': html=screenParents(); break;
    default: html=screenHome();
  }
  main.innerHTML=html;
  dressChevra();
  bindScreen(r);
  if(r==='jeu') showQuestion();
  else window.scrollTo(0,0);
  if(r==='fin') afterVictory();
}

function bindScreen(r){
  if(r==='parents' && !parentOK){
    $('#gateForm').addEventListener('submit', e=>{ e.preventDefault(); const v=parseInt($('#gateIn').value.replace(/\s/g,''),10);
      if(v===gateAnswer){ parentOK=true; render(); } else { $('#gateMsg').textContent='Ce n\'est pas le bon résultat, réessayez.'; $('#gateIn').value=''; $('#gateIn').focus(); } });
    setTimeout(()=>$('#gateIn')&&$('#gateIn').focus(),50);
  }
  if(r!=='parents') parentOK=false;   // on referme l'espace parents en le quittant
  const nameIn=$('#nameIn'); if(nameIn) nameIn.addEventListener('change', ()=>{ S.name=nameIn.value.trim().slice(0,20)||'Alicia'; nameIn.value=S.name; save(); renderPanel(); });
  if(r==='carte'||!r) say(phrase('hello'),'happy');
  if(r==='ile') say('Choisis un thème et un niveau. Chaque étoile gagnée débloque le niveau suivant !','encourage');
  if(r==='boutique') say('Ooooh, des accessoires ! Lequel tu me mets ?','happy');
  if(r==='revision') say(srsDue().length?'On revoit les questions difficiles, tu vas voir, ça rentre !':'Rien à réviser, tu gères !','encourage');
  if(r==='defi') say('Un petit défi chaque jour, c\'est la recette des championnes !','happy');
  if(r==='moi') say('C\'est ton coin à toi ! Regarde tous tes badges.','happy');
  if(r==='parents') say('Chut… c\'est l\'espace des grands !','think',true);
}
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-go]'); if(!t || t.disabled) return;
  if(t.dataset.go!==undefined){ sfx('tap'); go(t.dataset.go); return; }
  if(t.dataset.play){ sfx('tap'); const [s,th,l]=t.dataset.play.split('/'); startLevel(s,th,+l); return; }
  if(t.hasAttribute('data-chrono')){ sfx('tap'); startChrono(); return; }
  if(t.hasAttribute('data-start-daily')){ sfx('tap'); startDaily(); return; }
  if(t.hasAttribute('data-start-rev')){ sfx('tap'); startRevision(); return; }
  if(t.dataset.buy){ buy(t.dataset.buy); return; }
  if(t.dataset.equip){ equip(t.dataset.equip); return; }
  if(t.dataset.set){ toggleSetting(t.dataset.set); return; }
  if(t.classList.contains('soundbtn')){ S.settings.sound=!S.settings.sound; save(); renderFrame(); if(S.settings.sound) sfx('good'); const sw=$('[data-set="sound"]'); if(sw) sw.setAttribute('aria-checked', String(S.settings.sound)); return; }
  if(t.hasAttribute('data-reset')){ confirmReset(); return; }
});
function toggleSetting(k){
  if(k==='calm') S.settings.calm=!isCalm(); else S.settings[k]=!S.settings[k];
  save(); applySettings(); renderFrame();
  const b=$(`[data-set="${k}"]`); if(b) b.setAttribute('aria-checked', String(k==='calm'?isCalm():S.settings[k]));
  if(k==='sound' && S.settings.sound) sfx('good');
}
function applySettings(){
  document.documentElement.classList.toggle('calm', !!isCalm());
  document.documentElement.classList.toggle('dys', !!S.settings.dys);
}
function buy(id){ const it=SHOP.find(x=>x.id===id); if(!it||S.owned.includes(id)||S.coins<it.prix) return;
  S.coins-=it.prix; S.owned.push(id); S.equipped[it.slot]=id; const nb=checkBadges(); save(); sfx('coin'); render();
  say('Merci ! J\'adore mon nouvel accessoire !','celebrate'); setTimeout(()=>say('Je suis trop belle comme ça, non ?','happy'),2200);
  toast('🛍️ '+it.nom+' : acheté !'+(nb.length?' Nouveau badge : '+nb.map(b=>b.e+' '+b.nom).join(', '):''));
  const b=$(`[data-equip="${id}"]`); b&&b.focus();
}
function equip(id){ const it=SHOP.find(x=>x.id===id); if(!it) return; S.equipped[it.slot] = S.equipped[it.slot]===id ? null : id; save(); sfx('tap'); render(); say(S.equipped[it.slot]?'Comment tu me trouves ?':'Hop, rangé !','happy'); const b=$(`[data-equip="${id}"]`); b&&b.focus(); }
function confirmReset(){
  modal(`<h2>Tout effacer ?</h2><p>Étoiles, pièces, badges, accessoires et statistiques seront supprimés. Cette action est définitive.</p><div class="row" style="justify-content:center"><button class="btn" data-close>Annuler</button><button class="btn primary" data-yes>Oui, tout effacer</button></div>`,
    m=>{ m.querySelector('[data-yes]').onclick=()=>{ localStorage.removeItem(KEY); S=freshState(); save(); closeModal(); parentOK=false; applySettings(); go('carte'); toast('Progression remise à zéro.'); }; });
}
function modal(html, init){ closeModal(); const back=document.createElement('div'); back.className='modal-back'; back.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(back);
  back.addEventListener('click', e=>{ if(e.target===back || e.target.closest('[data-close]')) closeModal(); }); init&&init(back); const f=back.querySelector('button'); f&&f.focus(); }
function closeModal(){ $$('.modal-back').forEach(m=>m.remove()); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function toast(msg){ $$('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

function newSession(kind, questions, meta){
  SESSION = Object.assign({kind, questions, idx:0, ok:0, results:[], points:0, start:Date.now(), qStart:Date.now()}, meta||{});

function startLevel(sid, tid, lvl){

function renderClasser(q, el){
  const items=shuffle(q.elements.map((e,i)=>({t:e[0], c:e[1], i})));

function makeDraggable(el, onDrop){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0 || !SESSION || SESSION.answered) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, over=null, lastY=sy, scrolling=0;
    // Défilement automatique quand on approche du haut ou du bas de l'écran (petits téléphones)
    const autoScroll=()=>{ if(!ghost) { scrolling=0; return; } const edge=70; let dy=0;
      if(lastY>innerHeight-edge) dy=Math.ceil((lastY-(innerHeight-edge))/5); else if(lastY<edge) dy=-Math.ceil((edge-lastY)/5);
      if(dy) window.scrollBy(0,dy); scrolling=requestAnimationFrame(autoScroll); };
    const move=ev=>{
      lastY=ev.clientY;
      if(!ghost){ if(Math.hypot(ev.clientX-sx, ev.clientY-sy)<8) return; ghost=el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); document.body.appendChild(ghost); el.classList.add('dragging'); scrolling=requestAnimationFrame(autoScroll); }
      ev.preventDefault();
      ghost.style.transform=`translate(${ev.clientX-ghost.offsetWidth/2}px, ${ev.clientY-ghost.offsetHeight/2}px) rotate(-3deg)`;
      const z=document.elementFromPoint(ev.clientX, ev.clientY); const zone=z&&z.closest('[data-zone]');
      if(over&&over!==zone) over.classList.remove('over'); if(zone) zone.classList.add('over'); over=zone;
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      if(!ghost) return; cancelAnimationFrame(scrolling); const g=ghost; ghost=null; g.remove(); el.classList.remove('dragging'); if(over) over.classList.remove('over');
      el._dragged=true; setTimeout(()=>{ el._dragged=false; }, 60);
      if(ev.type==='pointercancel') return;
      const z=document.elementFromPoint(ev.clientX, ev.clientY); const zone=z&&z.closest('[data-zone]'); if(zone) onDrop(zone.dataset.zone);
    };
    window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
}

const PAIR_COLORS=['#7a5cd6','#e0306f','#147a52','#b86e00','#2f6fd0','#8a5a44'];
function renderRelier(q, el){

    $$('[data-l]',el).forEach(b=>b.onclick=()=>{ if(SESSION.answered) return; sfx('tap'); const i=+b.dataset.l; if(link[i]!=null){ delete link[i]; selL=i; } else selL = selL===i?null:i; draw(); const nb=selL!=null? $('[data-r]',el) : $(`[data-l="${i}"]`,el); nb&&nb.focus({preventScroll:true}); });

      if(li!=null) delete link[li]; link[selL]=r; selL=null; sfx('tap'); draw(); const nxt=L.find(x=>link[x.i]==null); const nb=nxt? $(`[data-l="${nxt.i}"]`,el) : $('#check',el); nb&&nb.focus({preventScroll:true}); });
    $('#check',el).disabled = Object.keys(link).length!==L.length;
  }
  $('#check',el).onclick=()=>{ if(SESSION.answered) return; let good=0; L.forEach(x=>{ const ok=link[x.i]===x.i; good+=ok; $(`[data-l="${x.i}"]`,el).classList.add(ok?'good':'bad'); $(`[data-r="${link[x.i]}"]`,el).classList.add(ok?'good':'bad'); });

// --- Remettre dans l'ordre (frise chronologique, lettres, mots d'une phrase)
function renderOrdre(q, el){
  const sep = q.style==='lettres' ? '' : ' ';
  const target = q.elements.join(sep);
  let pool=q.elements.map((t,i)=>({t,i})); let tries=0; do{ pool=shuffle(pool); tries++; } while(pool.map(p=>p.t).join(sep)===target && tries<30);
  const ans=[];
  const cls = q.style==='lettres'?'letters':(q.style==='mots'?'':'frise');
  const hint = q.style==='frise' ? 'Du plus ancien (en haut) au plus récent (en bas). ' : (q.style==='liste' ? 'Place les étiquettes de la première à la dernière. ' : '');
  el.innerHTML = qText(q)+`<p class="hint">${hint}Touche les étiquettes dans le bon ordre. Touche une étiquette déjà placée pour la retirer.</p>
   <div class="answerline ${cls}" id="ansl" role="group" aria-label="Ta réponse"></div><div class="chips" id="opool" role="group" aria-label="Étiquettes à placer"></div><div class="checkrow"><button class="btn" id="undo">↩ Tout reprendre</button><button class="btn primary" id="check" disabled>Vérifier</button></div>`;
  function draw(){
    $('#ansl',el).innerHTML = ans.length? ans.map((p,n)=>`<button class="chip" data-a="${n}" data-n="${n+1}" aria-label="Position ${n+1} : ${esc(p.t)}. Toucher pour retirer">${esc(p.t)}</button>`).join('') : '<span class="ph">Ta réponse apparaîtra ici…</span>';
    $('#opool',el).innerHTML = pool.filter(p=>!ans.includes(p)).map(p=>`<button class="chip" data-p="${p.i}">${esc(p.t)}</button>`).join('');
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{ if(SESSION.answered) return; sfx('tap'); ans.push(pool.find(p=>p.i===+b.dataset.p)); draw(); const nb=$('[data-p]',el)||$('#check',el); nb&&nb.focus({preventScroll:true}); });
    $$('[data-a]',el).forEach(b=>b.onclick=()=>{ if(SESSION.answered) return; sfx('tap'); ans.splice(+b.dataset.a,1); draw(); });
    $('#check',el).disabled = ans.length!==pool.length;
  }
  $('#undo',el).onclick=()=>{ if(SESSION.answered) return; ans.length=0; draw(); };
  $('#check',el).onclick=()=>{ if(SESSION.answered) return; const ok = ans.map(p=>p.t).join(sep)===target;
    $$('#ansl .chip',el).forEach((c,n)=>{ c.classList.add(ans[n].t===q.elements[n]?'good':'bad'); c.disabled=true; }); $('#check',el).disabled=true; $('#undo',el).disabled=true;
    answer(ok, ok?'':`Le bon ordre : <span class="ans">${q.elements.map(esc).join(q.style==='lettres'?'':(q.style==='mots'?' ':' → '))}</span>`); };
  draw();
}
// --- Dictée : saisie au clavier, comparaison tolérante (espaces, majuscules, apostrophes ; accents signalés)
function normBase(s){ return String(s).trim().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/\s*([?.!,;:])$/,'$1'); }
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae'); }
function checkDictee(input, answers){
  answers=[].concat(answers); const a=normBase(input);
  for(const r of answers){ const b=normBase(r);
    if(a===b) return {ok:true, note:''};
    if(a.toLowerCase()===b.toLowerCase()) return {ok:true, note: /[A-Z]/.test(b)? `Petit détail : on écrit « ${b} » avec une majuscule.` : ''};
  }
  for(const r of answers){ const b=normBase(r);
    if(stripAccents(a.toLowerCase())===stripAccents(b.toLowerCase())) return {ok:true, partial:true, note:`Presque parfait ! Attention aux accents : on écrit « ${b} ».`};
  }
  return {ok:false};
}
let speechVoices=[];
function loadVoices(){ try{ speechVoices = speechSynthesis.getVoices()||[]; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){} }
function speak(text, lang){
  if(!('speechSynthesis' in window)) return false;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.8;
    const v=speechVoices.find(v=>v.lang && v.lang.replace('_','-').toLowerCase()===lang.toLowerCase()) || speechVoices.find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); if(v) u.voice=v; speechSynthesis.speak(u); return true; }catch(e){ return false; }
}
function renderDictee(q, el){

  const submit=()=>{ if(SESSION.answered) return; if(!inp.value.trim()){ inp.focus(); say('Écris ta réponse dans la case !','encourage'); return; }

function numpadHTML(){ return `<div class="numpad" role="group" aria-label="Pavé numérique">${['7','8','9','4','5','6','1','2','3',',','0','⌫'].map(k=>`<button data-k="${k}" aria-label="${k==='⌫'?'Effacer':(k===','?'Virgule':k)}">${k}</button>`).join('')}<button class="ok" data-k="ok" style="grid-column:1/-1">Valider ✔</button></div>`; }
function bindNumpad(el, getVal, setVal, onOk){
  $$('.numpad button',el).forEach(b=>b.onclick=()=>{ const k=b.dataset.k; sfx('tap'); if(k==='ok') return onOk(); let v=getVal(); if(k==='⌫') v=v.slice(0,-1); else if(v.length<10 && !(k===','&&v.includes(','))) v+=k; setVal(v); });
  const kh=e=>{ if(!el.isConnected){ document.removeEventListener('keydown',kh); return; } if(/INPUT|TEXTAREA/.test(e.target.tagName)||$('.modal-back')) return;
    if(/^[0-9]$/.test(e.key)){ setVal((getVal()+e.key).slice(0,10)); e.preventDefault(); }
    else if((e.key===','||e.key==='.') && !getVal().includes(',')){ setVal(getVal()+','); e.preventDefault(); }
    else if(e.key==='Backspace'){ setVal(getVal().slice(0,-1)); e.preventDefault(); }
    else if(e.key==='Enter' && !(e.target.closest&&e.target.closest('button'))){ onOk(); e.preventDefault(); } };
  document.addEventListener('keydown',kh);
}
function parseNum(v){ return parseFloat(String(v).replace(/\s/g,'').replace(',','.')); }
function fmtNum(n){ const [i,d]=String(n).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+(d?','+d:''); }
function renderCalcul(q, el){
  let val=''; const T=q.temps||20;
  el.innerHTML = `<p class="qtext" style="margin-bottom:6px">Calcule de tête :</p><div class="timer" role="img" aria-label="Temps restant"><i id="tbar"></i></div><div class="calc-display" id="qtext">${esc(q.question)} = ?</div><div class="calc-answer" id="cval" aria-live="polite">&nbsp;</div>${numpadHTML()}<p class="hint" style="text-align:center;margin-top:10px">Tu as ${T} secondes. Pas de panique, c'est pour s'entraîner !</p>`;
  const set=v=>{ val=v; $('#cval',el).textContent = val||'\u00a0'; };
  const done=(timeout)=>{ if(SESSION.answered) return; clearInterval(SESSION.timer); SESSION.timer=null; $$('.numpad button',el).forEach(b=>b.disabled=true);
    const ok=!timeout && Math.abs(parseNum(val)-q.reponse)<1e-9;
    answer(ok, ok?'':(timeout?`Le temps est écoulé, ce n'est pas grave ! `:'')+`La réponse : <span class="ans">${esc(q.question)} = ${fmtNum(q.reponse)}</span>`); };
  bindNumpad(el, ()=>val, set, ()=>{ if(val) done(false); });
  const t0=Date.now(); SESSION.timer=setInterval(()=>{ const left=T-(Date.now()-t0)/1000; const bar=$('#tbar',el); if(bar) bar.style.width=Math.max(0,left/T*100)+'%'; if(left<=0) done(true); },200);
}

/* ---------- 15. Réponse, encouragements et enregistrement ---------- */
function answer(ok, detail, score){
  const s=SESSION, q=s.questions[s.idx]; s.answered=true;
  if(score==null) score = ok?1:0;
  const pts = ok ? Math.round(10*q.niveau*(score<1?.5:1)) : 0;
  s.points+=pts; s.results.push(ok); if(ok) s.ok++;
  record(q, ok, s.kind==='revision');
  sfx(ok?'good':'bad');
  say(ok? phrase('good') : phrase('bad'), ok?'happy':'sad');
  const last = s.idx>=s.questions.length-1;
  $('#fb').innerHTML = `<div class="feedback ${ok?'good':'bad'}" role="status"><div class="ft">${ok?'🎉 Bravo !':'💛 Pas grave !'} ${pts?`<span class="muted" style="font-size:.95rem">+${pts} points</span>`:''}</div>${detail?`<div>${detail}</div>`:''}<div class="expl">💡 ${esc(q.explication)}</div><button class="btn primary wide" id="next">${last?'Voir mes résultats ⭐':'Question suivante →'}</button></div>`;
  document.body.classList.add('has-feedback');
  const nb=$('#next'); nb.onclick=next; nb.focus({preventScroll:true});
  if(window.innerWidth>=768) $('#fb').scrollIntoView({behavior: isCalm()?'auto':'smooth', block:'nearest'});
  const d=$('.dots'); if(d) d.outerHTML=dotsHTML();
  const gp=$('#gpts'); if(gp){ gp.textContent='✨ '+s.points; gp.setAttribute('aria-label', s.points+' points'); }
}
function record(q, ok, inRevision){
  const el=Math.min(120,(Date.now()-SESSION.qStart)/1000);
  S.time[q.subj]=(S.time[q.subj]||0)+el;
  const k=q.subj+'/'+q.theme; S.themeStats[k]=S.themeStats[k]||{ok:0,tot:0}; S.themeStats[k].tot++; if(ok) S.themeStats[k].ok++;
  S.qstats[q.id]=S.qstats[q.id]||{ok:0,ko:0}; ok? S.qstats[q.id].ok++ : S.qstats[q.id].ko++;
  S.totalAns++; if(ok) S.totalOk++;
  if(!ok) srsMiss(q, inRevision); else if(inRevision) srsHit(q);
  save();
}
function next(){ sfx('tap'); const s=SESSION; if(!s) return; if(s.idx<s.questions.length-1){ s.idx++; showQuestion(); window.scrollTo(0,0); } else finish(); }
function starsFor(r){ return r>=.9?3 : r>=.65?2 : r>=.35?1 : 0; }
function finish(){
  const s=SESSION; const n=s.questions.length; const ratio = n? s.ok/n : 0;
  let stars=starsFor(ratio), coins=0; const bonus=[];
  touchStreak();
  if(s.kind==='level'){
    const k=s.sid+'/'+s.tid+'/'+s.lvl; const prev=S.stars[k]||0;
    if(stars>prev){ S.stars[k]=stars; coins+=(stars-prev)*5; bonus.push('Nouvelles étoiles : +'+((stars-prev)*5)+' pièces'); if(stars===3){ coins+=10; bonus.push('Niveau parfait : +10 pièces'); } }
    S.levelsDone++;
  } else if(s.kind==='daily'){
    if(!(S.daily.date===todayStr()&&S.daily.done)){ S.daily={date:todayStr(), done:true, count:(S.daily.count||0)+1}; coins+=15; bonus.push('Défi du jour : +15 pièces'); }
  } else if(s.kind==='revision'){ S.revisions++; coins+=5; bonus.push('Révision terminée : +5 pièces'); }
  coins += s.ok*2;
  S.coins+=coins; S.xp+=s.points+s.ok*5;
  const nb=checkBadges(); save();
  lastResult={kind:s.kind, stars, ok:s.ok, n, coins, points:s.points, badges:nb, bonus, title:s.title, sid:s.sid, tid:s.tid, lvl:s.lvl};
  SESSION=null; go('fin');
}
function screenVictory(){
  const r=lastResult; const great = r.kind==='chrono' ? r.ok>=8 : r.stars>=2;
  let btns='';
  if(r.kind==='level'){
    if(r.lvl<3 && r.stars>=1) btns=`<button class="btn primary" data-play="${r.sid}/${r.tid}/${r.lvl+1}">Niveau suivant →</button>`;
    btns+=`<button class="btn ${btns?'':'primary'}" data-play="${r.sid}/${r.tid}/${r.lvl}">↻ Rejouer</button><button class="btn" data-go="ile/${r.sid}">Retour à l'île</button>`;
  } else if(r.kind==='chrono') btns=`<button class="btn primary" data-chrono>↻ Rejouer</button><button class="btn" data-go="ile/maths">Retour à l'île</button>`;
  else if(r.kind==='revision') btns = srsDue().length? `<button class="btn primary" data-start-rev>Continuer la révision</button><button class="btn" data-go="carte">Carte</button>` : `<button class="btn primary" data-go="carte">Retour à la carte</button>`;
  else btns=`<button class="btn primary" data-go="carte">Retour à la carte</button><button class="btn" data-start-daily>↻ Rejouer</button>`;
  const title = r.kind==='chrono' ? (r.record ? 'Nouveau record !' : 'Bien joué !') : (r.stars===3?'Parfait, bravo !': r.stars===2?'Super travail !': r.stars===1?'Bien joué !':'Bel effort !');
  const due=srsDue().length;
  return `<section class="screen victory"><div class="card">
    ${chevraHost()}
    <h1>${title}</h1><p class="muted" style="margin:0">${esc(r.title)}</p>
    ${r.kind==='chrono' ? `<div class="bigstars" aria-hidden="true"><span class="on">⚡</span></div><p style="font-size:1.3rem;font-weight:800">${plural(r.ok,'calcul réussi','calculs réussis')} en 60 secondes</p><p class="muted">Ton record : ${S.chronoBest}</p>`
      : `<div class="bigstars" role="img" aria-label="${r.stars} étoile${r.stars>1?'s':''} sur 3">${[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}">⭐</span>`).join('')}</div><p style="font-size:1.2rem;font-weight:800">${r.ok} bonne${r.ok>1?'s':''} réponse${r.ok>1?'s':''} sur ${r.n}</p>`}
    <div class="rewards"><span class="reward">🪙 +${r.coins} pièces</span><span class="reward">✨ +${r.points} points</span><span class="reward">🔥 ${plural(currentStreak(),'jour')}</span></div>
    ${r.bonus.length?`<p class="muted">${r.bonus.map(esc).join(' · ')}</p>`:''}
    ${r.badges.map(b=>`<div class="newbadge">${b.e} Nouveau badge : ${esc(b.nom)} !</div>`).join('')}
    <p style="font-weight:700">${esc(great? phrase('win') : phrase('soso'))}</p>
    ${r.kind==='level'&&r.stars===0?'<p class="muted">Gagne au moins une étoile pour débloquer le niveau suivant. Tu peux réessayer autant que tu veux !</p>':''}
    ${r.kind!=='revision'&&due?`<p class="muted">🔁 ${plural(due,'question')} t'attend${due>1?'ent':''} dans la révision intelligente.</p>`:''}
    <div class="row" style="justify-content:center;margin-top:10px">${btns}</div></div></section>`;
}
function afterVictory(){
  const r=lastResult; const great = r.kind==='chrono' ? r.ok>=8 : r.stars>=2;
  say(great? 'Youpiii ! '+phrase('win') : phrase('soso'), great?'celebrate':'encourage', great);
  if(great){ sfx('win'); confetti(); } else sfx('coin');
  const b=$('#main .victory .row .btn'); b&&b.focus({preventScroll:true});
}

/* ---------- 16. Chrono-calcul (60 secondes) ---------- */
function genCalc(){
  const t=rand(5);
  if(t<=1){ const a=2+rand(9), b=2+rand(9); return {q:a+' × '+b, a:a*b}; }
  if(t===2){ const a=10+rand(80), b=5+rand(40); return {q:a+' + '+b, a:a+b}; }
  if(t===3){ const a=30+rand(70), b=5+rand(25); return {q:a+' − '+b, a:a-b}; }
  const b=2+rand(8), r=2+rand(9); return {q:(b*r)+' ÷ '+b, a:r};
}
function showChrono(){
  const g=$('#game'); const s=SESSION;
  if(!s.started){
    g.innerHTML = gameHead()+`<div class="qcard" style="text-align:center"><div style="font-size:3rem" aria-hidden="true">⏱️</div><h2>Chrono-calcul</h2><p>Enchaîne le plus de calculs possible en <b>60 secondes</b> : tables, additions, soustractions et divisions. Une erreur ? Pas grave, on passe au suivant !</p><p class="muted">Record actuel : ${S.chronoBest}</p><button class="btn primary" id="go">Partez !</button></div>`;
    dressChevra(); say('Prête ? Mes sabots sont sur la ligne de départ !','encourage',true);
    $('[data-quit]').onclick=quitGame; $('#go').onclick=()=>{ sfx('tap'); s.started=true; s.t0=Date.now(); s.qStart=Date.now(); showChrono(); }; $('#go').focus({preventScroll:true}); return;
  }
  let cur=genCalc(), val='';
  g.innerHTML = gameHead()+`<div class="qcard" style="text-align:center"><div class="timer" aria-hidden="true"><i id="tbar"></i></div><div class="row" style="justify-content:space-between"><span class="pill" id="tleft">⏱️ 60 s</span><span class="pill" id="cok" aria-live="polite">✅ 0</span></div><div class="calc-display" id="cq">${esc(cur.q)} = ?</div><div class="calc-answer" id="cval">&nbsp;</div>${numpadHTML()}</div>`;
  dressChevra(); say('Vas-y, fonce !','happy'); $('[data-quit]').onclick=quitGame;
  const el=$('.qcard',g);
  const set=v=>{ val=v; $('#cval').textContent=val||'\u00a0'; };
  const ok=()=>{ if(!val||s.over) return; const good=Math.abs(parseNum(val)-cur.a)<1e-9; if(good){ s.ok++; s.points+=5; sfx('good'); } else sfx('bad');
    s.results.push(good); $('#cok').textContent='✅ '+s.ok; const cv=$('#cval'); cv.style.background=good?'var(--ok-l)':'var(--ko-l)'; setTimeout(()=>{ if(cv.isConnected) cv.style.background=''; },250);
    if(!good) say('Oups, '+cur.q+' = '+fmtNum(cur.a)+'. On continue !','encourage'); else if(s.ok%5===0) say('Waouh, déjà '+s.ok+' !','happy');
    cur=genCalc(); $('#cq').textContent=cur.q+' = ?'; set(''); };
  bindNumpad(el, ()=>val, set, ok);
  s.timer=setInterval(()=>{ if(SESSION!==s){ clearInterval(s.timer); return; } const left=60-(Date.now()-s.t0)/1000; const bar=$('#tbar'); if(bar) bar.style.width=Math.max(0,left/60*100)+'%'; const tl=$('#tleft'); if(tl) tl.textContent='⏱️ '+Math.max(0,Math.ceil(left))+' s';
    if(left<=0){ clearInterval(s.timer); s.timer=null; s.over=true; endChrono(); } },200);
}
function endChrono(){
  const s=SESSION; const best0=S.chronoBest; const record = s.ok>best0; if(record) S.chronoBest=s.ok;
  touchStreak(); const coins=s.ok; S.coins+=coins; S.xp+=s.points; S.time.maths=(S.time.maths||0)+60;
  const nb=checkBadges(); save();
  lastResult={kind:'chrono', ok:s.ok, n:s.results.length, coins, points:s.points, badges:nb, bonus: record&&best0>0?['Tu as battu ton record de '+best0+' !']:[], title:'⏱️ Chrono-calcul', record: record&&s.ok>0, stars:0};
  SESSION=null; go('fin');
}

/* ---------- 17. Confettis ---------- */
function confetti(){
  if(isCalm()) return;
  const c=$('#confetti'), ctx=c.getContext('2d'); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=['#ff9fc4','#7fe0c3','#ffd36e','#8fd3ff','#c3a6ff','#ffb38a'];
  const P=Array.from({length:140},()=>({x:Math.random()*W, y:-20-Math.random()*H*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:4+Math.random()*5, c:pick(cols), a:Math.random()*6, va:(Math.random()-.5)*.3}));
  let t=0; (function frame(){ ctx.clearRect(0,0,W,H); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if(++t<200) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H); })();
}

/* ---------- 18. Lancement ---------- */
applySettings();
try{ matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', ()=>{ applySettings(); }); }catch(e){}
$$('.brand').forEach(b=>b.addEventListener('click', ()=>go('carte')));
render();
// Accès en lecture pour les tests automatiques
window.__chevra = { get state(){ return S; }, ALLQ, SUBJECTS, checkDictee, srsDue, dailyQuestions, get session(){ return SESSION; } };
})();

</script>
